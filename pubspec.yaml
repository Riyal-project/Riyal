name: riyal
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.1
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  supabase_flutter: ^2.8.0
  google_fonts: ^8.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icon/
    - lib/assets/logos/
    - .env
  fonts:
    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans/GeneralSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/GeneralSans/GeneralSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

